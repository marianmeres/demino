# Demino promises "runs on Deno and Node"; only a matrix proves that on every
# push. Each job runs `package.json` scripts only, so CI checks what
# `pnpm run ...` checks locally - nothing is defined only here.
#
# - Node runs the two current majors and is the gate: `pnpm run ci` is the
#   typecheck (tsc --noEmit, the only type gate - the suite is type-stripped),
#   Biome (format, lint, import order), the suite, and the npm smoke (build,
#   pack, install, import, serve).
# - Deno is a consumer runtime (JSR, the `/deno` adapter): the same suite on
#   Deno plus the JSR publish dry run (type check, slow types, file list). It
#   is pinned to the exact version used locally (the runtime is in
#   bug-fix-only mode; bump the pin deliberately, in its own commit).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: Deno ${{ matrix.deno }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        deno: ["2.9.8"]
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}
      # pnpm only runs the scripts here; Deno resolves through deno.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm run test:deno
      - run: pnpm run jsr:check

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7
      # pnpm version is read from package.json "packageManager"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
